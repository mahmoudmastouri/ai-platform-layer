# AI platform layer for CT 210 (ai-platform-01).
#
# `name:` is pinned to the legacy value from ai-platform-stack so that the running
# containers, named volumes (<name>_<volume>) and network (<name>_default) are
# adopted in place instead of recreated empty. Never change it (ADR-025).
name: ai-platform-stack

# No proxy service and no proxy labels: Traefik runs in a separate LXC (151) and
# reaches this stack only over the published ports below.

# Bounded json-file logs for the services added after the move. The two original
# services keep their definitions unchanged.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Environment shared by langfuse-web and langfuse-worker (Langfuse v4).
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://192.168.1.60:3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-langfuse}
  SALT: ${SALT:?set SALT in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"
  # Single node. The v4 schema defaults this to true, so it must be explicit.
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH in .env}
  # Event blobs go to the SeaweedFS S3 endpoint on the compose network, path-style.
  # Langfuse uses the existing `platform` S3 identity (ADR-022).
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
  # Batch export is off. Media upload is off because LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
  # is deliberately not set anywhere.
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    container_name: ai-platform-seaweedfs
    restart: unless-stopped
    # Measured 78 MiB idle (docker stats, 124 MB of data). ~3x headroom.
    mem_limit: 224m
    # The S3 identity file carries the credentials, so it is generated at start-up
    # from .env into a named volume. Nothing secret is ever committed or baked in.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${SEAWEEDFS_S3_ACCESS_KEY:?must be set in .env}"
        : "$${SEAWEEDFS_S3_SECRET_KEY:?must be set in .env}"
        mkdir -p /etc/seaweedfs
        umask 077
        cat > /etc/seaweedfs/s3.json <<JSON
        {
          "identities": [
            {
              "name": "platform",
              "credentials": [
                {
                  "accessKey": "$${SEAWEEDFS_S3_ACCESS_KEY}",
                  "secretKey": "$${SEAWEEDFS_S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        JSON
        exec weed server \
          -dir=/data \
          -ip=seaweedfs \
          -ip.bind=0.0.0.0 \
          -master.defaultReplication=000 \
          -master.volumeSizeLimitMB=$${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB} \
          -volume.max=$${SEAWEEDFS_VOLUME_MAX} \
          -filer \
          -s3 \
          -s3.port=8333 \
          -s3.config=/etc/seaweedfs/s3.json
    environment:
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
      SEAWEEDFS_VOLUME_SIZE_LIMIT_MB: ${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}
      SEAWEEDFS_VOLUME_MAX: ${SEAWEEDFS_VOLUME_MAX:-32}
    ports:
      # Only the S3 API is published. Master (9333), volume (8080) and filer (8888)
      # stay on the compose network.
      - "${BIND_ADDRESS:-192.168.1.60}:${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
      - seaweedfs_config:/etc/seaweedfs
    healthcheck:
      # Real cluster health from the master, plus the S3 gateway actually serving.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9333/cluster/healthz > /dev/null &&
          curl -fsS http://127.0.0.1:8333/status > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: ai-platform-qdrant
    restart: unless-stopped
    # Measured 40 MiB idle with empty storage, before any collection existed. 1g leaves
    # room for real collections now that CT 210 has 16 GiB (ADR-026).
    mem_limit: 1g
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      # REST only. The gRPC port (6334) stays unpublished.
      - "${BIND_ADDRESS:-192.168.1.60}:${QDRANT_REST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships no curl/wget, so the probe speaks HTTP over bash's /dev/tcp.
      # /readyz is exempt from API-key auth, so no credential is needed here.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot: creates the langfuse-events bucket through the S3 API (SigV4 with curl,
  # from the SeaweedFS image already on the host). Idempotent: an existing bucket is
  # success. No healthcheck: a job that exits has no health, it is gated with
  # service_completed_successfully instead.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.41
    container_name: ai-platform-seaweedfs-init
    restart: "no"
    mem_limit: 32m
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: langfuse-events
      S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        # SHA-256 of an empty body, required by the S3 signature for HEAD and empty PUT.
        EMPTY=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        status() {
          curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            --aws-sigv4 "aws:amz:$${S3_REGION}:s3" --user "$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}" \
            -H "x-amz-content-sha256: $${EMPTY}" "$$@" || echo 000
        }
        url="$${S3_ENDPOINT}/$${S3_BUCKET}"
        if [ "$$(status -I "$${url}")" = 200 ]; then
          echo "bucket $${S3_BUCKET} already exists"
          exit 0
        fi
        code="$$(status -X PUT "$${url}")"
        case "$${code}" in
          200|409) ;;
          *) echo "create bucket $${S3_BUCKET} failed: HTTP $${code}" >&2; exit 1 ;;
        esac
        [ "$$(status -I "$${url}")" = 200 ] || { echo "bucket $${S3_BUCKET} not visible after create" >&2; exit 1; }
        echo "bucket $${S3_BUCKET} created"
    logging: *default-logging

  postgres:
    image: postgres:17.11-alpine3.24
    container_name: ai-platform-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      # Disposable at the demo tier (ADR-022): lost when CT 210 is destroyed.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.4.5.143
    container_name: ai-platform-clickhouse
    restart: unless-stopped
    user: "101:101"
    # 3g = the 2.4 GiB server cap in config.d/langfuse.xml plus 0.6 GiB for client
    # buffers and page cache accounted to the cgroup.
    mem_limit: 3g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      # Disposable at the demo tier (ADR-022): lost when CT 210 is destroyed.
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/langfuse.xml:/etc/clickhouse-server/config.d/langfuse.xml:ro
    healthcheck:
      # A real authenticated query, not just the HTTP ping.
      test: ["CMD-SHELL", 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24
    container_name: ai-platform-valkey
    restart: unless-stopped
    mem_limit: 256m
    command:
      - valkey-server
      - /etc/valkey/valkey.conf
      - --requirepass
      - ${REDIS_AUTH:?set REDIS_AUTH in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH:?set REDIS_AUTH in .env}
    volumes:
      - valkey_data:/data
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging

  # Runs the Postgres and ClickHouse migrations on start, then the headless init.
  langfuse-web:
    image: ghcr.io/langfuse/langfuse:4.41.0
    container_name: ai-platform-langfuse-web
    restart: unless-stopped
    # 2g with an explicit heap. At 1g the process crash-looped with "Reached heap
    # limit Allocation failed" at about 512 MB of heap during init (ADR-022).
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      # LAN only. Traefik (LXC 151) reaches Langfuse over this port.
      - "${BIND_ADDRESS:-192.168.1.60}:${LANGFUSE_WEB_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env
      # Old-space heap in MiB, leaving 512 MiB of the 2g for the rest of the process.
      NODE_OPTIONS: "--max-old-space-size=1536"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      AUTH_DISABLE_SIGNUP: "true"
      # Headless init of the organisation, project, API keys and first user.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-ai-platform}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-AI Platform}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-shared}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-shared}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set LANGFUSE_INIT_PROJECT_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set LANGFUSE_INIT_PROJECT_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@ai-platform.internal}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env}
    healthcheck:
      # The server binds to the container hostname, so probe that, not 127.0.0.1.
      test: ["CMD-SHELL", 'wget -q --spider "http://$$(hostname):3000/api/public/health"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *default-logging

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:4.41.0
    container_name: ai-platform-langfuse-worker
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      # Waits for the web container so the database migrations are finished first.
      langfuse-web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      # Old-space heap in MiB, leaving 512 MiB of the 1536m for the rest of the process.
      NODE_OPTIONS: "--max-old-space-size=1024"
    healthcheck:
      test: ["CMD-SHELL", 'wget -q --spider "http://$$(hostname):3030/api/health"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # LLM gateway (ADR-018). Image pinned by tag and by digest. The digest was verified
  # with cosign against the key pinned at BerriAI/litellm commit 0112e53 (2026-09-24).
  # Not 1.82.7 or 1.82.8, the malicious PyPI releases of 2026-03-24.
  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    container_name: ai-platform-litellm
    restart: unless-stopped
    mem_limit: 768m
    command:
      - --config
      - /etc/litellm/config.yaml
      - --port
      - "4000"
      - --telemetry
      - "False"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      # No .env loading inside the container, admin UI off, no API docs pages.
      LITELLM_MODE: PRODUCTION
      DISABLE_ADMIN_UI: "true"
      NO_DOCS: "true"
      NO_REDOC: "true"
      # Do not fetch the price map, blog posts, presets or headers from GitHub at start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_LOCAL_BLOG_POSTS: "True"
      LITELLM_LOCAL_POLICY_TEMPLATES: "True"
      LITELLM_LOCAL_AUTOROUTER_PRESETS: "True"
      LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: "True"
    ports:
      # LAN only. Master key auth on every route except the health probes.
      - "${BIND_ADDRESS:-192.168.1.60}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    healthcheck:
      # The image has Python and no guaranteed curl. Liveness needs no key.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    logging: *default-logging

  # Fault injection for the gateway fallback tests. Only runs under
  # `docker compose --profile faults up -d`. Two paths, both answered for any
  # sub-path (LiteLLM appends /chat/completions):
  #   /timeout  sleeps 120 s, past the 5 s deployment timeout
  #   /5xx      returns HTTP 503 at once
  fault-stub:
    profiles: ["faults"]
    image: python:3.13.15-slim
    container_name: ai-platform-fault-stub
    restart: "no"
    mem_limit: 64m
    command:
      - python
      - -u
      - -c
      - |
        import json, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def _reply(self, status, body):
                data = json.dumps(body).encode()
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def _handle(self):
                length = int(self.headers.get("Content-Length") or 0)
                if length:
                    self.rfile.read(length)
                if self.path.startswith("/healthz"):
                    return self._reply(200, {"status": "ok"})
                if self.path.startswith("/timeout"):
                    time.sleep(120)
                    return self._reply(200, {"error": "slept past the client timeout"})
                if self.path.startswith("/5xx"):
                    return self._reply(503, {"error": {"message": "fault stub: 503", "type": "service_unavailable", "code": 503}})
                return self._reply(404, {"error": "unknown path"})

            do_GET = do_POST = _handle

            def log_message(self, fmt, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging: *default-logging

volumes:
  seaweedfs_data:
  seaweedfs_config:
  qdrant_data:
  # Demo tier, disposable (ADR-022): lost when CT 210 is destroyed.
  postgres_data:
  clickhouse_data:
  valkey_data:
