# Valkey for Langfuse (queues and cache). The password is not set here: it is passed
# on the command line from REDIS_AUTH in compose/.env so no secret is tracked.

port 6379
bind 0.0.0.0

# Hard memory cap and refusal instead of eviction. Langfuse queues jobs in Valkey
# (BullMQ); evicting a queue key would silently drop work, so writes fail instead.
maxmemory 200mb
maxmemory-policy noeviction

# Append-only file so queued jobs survive a restart. Snapshots off.
dir /data
appendonly yes
appendfsync everysec
save ""

loglevel notice
